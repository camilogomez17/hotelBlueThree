name: Prepare clean room photos
on:
  push:
    branches: [main]
    paths:
      - scripts/crop_room_photos.py
      - .github/workflows/prepare-room-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/crop_room_photos.py
      - name: Commit clean images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rooms-clean/
          if ! git diff --cached --quiet; then
            git commit -m "Generate clean 16:9 room photographs"
            git push
          fi
